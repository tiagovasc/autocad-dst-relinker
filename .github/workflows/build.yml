name: Build and test Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish standalone x64 executable and run tests
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'SheetSetRelinker-build'
          .\publish.ps1 -Runtime win-x64 -BuildRoot $buildRoot -Test

      - name: Check the packaged executable with synthetic files
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP ('SheetSetRelinker-diagnostic-' + [Guid]::NewGuid().ToString('N'))
          $executable = Join-Path $env:GITHUB_WORKSPACE 'dist\win-x64\SheetSetRelinker.exe'
          $process = Start-Process -FilePath $executable -ArgumentList @('--self-test', ('"' + $diagnostics + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw ('Packaged diagnostic failed with exit code ' + $process.ExitCode) }
          $reports = @(Get-ChildItem -LiteralPath $diagnostics -Filter 'result.txt' -Recurse -File)
          if ($reports.Count -ne 1 -or !(Get-Content -LiteralPath $reports[0].FullName -Raw).StartsWith('PASS packaged executable')) {
            throw 'The packaged diagnostic did not produce its expected PASS report.'
          }
          Get-Content -LiteralPath $reports[0].FullName

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SheetSetRelinker-windows-x64
          path: |
            dist/win-x64/SheetSetRelinker.exe
            dist/win-x64/SheetSetRelinker-windows-x64.zip
            dist/win-x64/SHA256SUMS.txt
            dist/win-x64/build-info.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@v8
        with:
          name: SheetSetRelinker-windows-x64
          path: release

      - name: Create release with standalone executable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @('release/SheetSetRelinker.exe', 'release/SheetSetRelinker-windows-x64.zip', 'release/SHA256SUMS.txt', 'release/build-info.json')
          gh release create $env:RELEASE_TAG @assets --verify-tag --title ('Sheet Set Relinker ' + $env:RELEASE_TAG) --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
